<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wetterstation Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 12px 16px;
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      text-align: center;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f1f5f9;
    }

    header p {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .slider-container {
      flex: 1;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .slider-container::-webkit-scrollbar {
      display: none;
    }

    .page {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 12px;
      border-left: 4px solid #38bdf8;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card.blue { border-left-color: #38bdf8; }
    .card.orange { border-left-color: #fb923c; }
    .card.purple { border-left-color: #c084fc; }
    .card.green { border-left-color: #4ade80; }

    .card-icon {
      font-size: 1.8rem;
      width: 40px;
      text-align: center;
    }

    .card-content {
      flex: 1;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .card-title-group h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f1f5f9;
    }

    .card-title-group p {
      font-size: 0.7rem;
      color: #94a3b8;
    }

    .battery-badge {
      font-size: 0.65rem;
      padding: 2px 6px;
      background-color: #334155;
      border-radius: 10px;
      color: #cbd5e1;
    }

    .battery-badge.low {
      background-color: #7f1d1d;
      color: #fca5a5;
    }

    .metrics-box {
      display: flex;
      justify-content: space-between;
      background-color: #0f172a;
      padding: 8px;
      border-radius: 8px;
      margin-top: 4px;
    }

    .metric {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    .metric-label {
      font-size: 0.65rem;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .metric-value {
      font-size: 0.85rem;
      font-weight: 700;
      color: #f8fafc;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .trend {
      font-size: 0.7rem;
    }

    .navigation-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background-color: #1e293b;
      border-top: 1px solid #334155;
      flex-shrink: 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #475569;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dot.active {
      background-color: #38bdf8;
      width: 20px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Wetterstation</h1>
    <p id="timestamp-text">Lade Daten...</p>
  </header>

  <div class="slider-container" id="slider">
    <!-- SEITE 1: NETATMO SENSOREN -->
    <div class="page" id="page1">
      <div id="cards"></div>
    </div>

    <!-- SEITE 2: REGENSENSOR & OPEN-METEO -->
    <div class="page" id="page2">
      <div id="forecast-cards" style="display: flex; flex-direction: column; gap: 12px; width: 100%;"></div>
    </div>
  </div>

  <div class="navigation-dots">
    <div class="dot active" onclick="scrollToPage(0)"></div>
    <div class="dot" onclick="scrollToPage(1)"></div>
  </div>

  <script>
    function getTrendIcon(trend) {
      if (trend === 'up') return '<span class="trend" style="color: #ef4444;">▲</span>';
      if (trend === 'down') return '<span class="trend" style="color: #38bdf8;">▼</span>';
      return '<span class="trend" style="color: #94a3b8;">▶</span>';
    }

    function getBatteryBadge(percent) {
      if (percent === undefined || percent === null) return '';
      const isLow = percent <= 20;
      return `<div class="battery-badge ${isLow ? 'low' : ''}">🔋 ${percent}%</div>`;
    }

    function getWeatherInfo(code) {
      switch (code) {
        case 0:  return { desc: "Klar / Sonnig", icon: "☀️" };
        case 1:  return { desc: "Überwiegend klar", icon: "🌤️" };
        case 2:  return { desc: "Teilweise bewölkt", icon: "⛅" };
        case 3:  return { desc: "Bedeckt", icon: "☁️" };
        case 45: case 48: return { desc: "Nebel", icon: "🌫️" };
        case 51: case 53: case 55: return { desc: "Nieselregen", icon: "🌦️" };
        case 61: case 63: case 65: return { desc: "Regen", icon: "🌧️" };
        case 71: case 73: case 75: return { desc: "Schneefall", icon: "❄️" };
        case 80: case 81: case 82: return { desc: "Regenschauer", icon: "🌧️" };
        case 95: return { desc: "Gewitter", icon: "🌩️" };
        default: return { desc: "Unbekannt (" + code + ")", icon: "🌡️" };
      }
    }

    function getDayName(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('de-DE', { weekday: 'short' });
    }

    async function loadData() {
      try {
        const res = await fetch('data.json');
        if (!res.ok) throw new Error("HTTP Fehler " + res.status);

        const data = await res.json();
        document.getElementById('timestamp-text').innerText = `Zuletzt aktualisiert: ${data.timestamp || '--:--'} Uhr`;

        // ================= SEITE 1: NETATMO SENSOREN =================
        const wrapper = document.getElementById('cards');
        wrapper.innerHTML = '';

        if (data.draussen) {
          const druckGerundet = data.druck?.val != null ? Math.round(data.druck.val) : '--';
          wrapper.innerHTML += `
            <div class="card blue">
              <div class="card-icon">☀️</div>
              <div class="card-content">
                <div class="card-header">
                  <div class="card-title-group">
                    <h3>Außenbereich</h3>
                    <p>Außensensor</p>
                  </div>
                  ${getBatteryBadge(data.draussen.battery)}
                </div>
                <div class="metrics-box">
                  <div class="metric">
                    <span class="metric-label">Temp</span>
                    <span class="metric-value">${data.draussen.temp ?? '--'} °C ${getTrendIcon(data.draussen.trend)}</span>
                  </div>
                  <div class="metric">
                    <span class="metric-label">Feuchte</span>
                    <span class="metric-value">${data.draussen.hum ?? '--'} %</span>
                  </div>
                  <div class="metric">
                    <span class="metric-label">Druck</span>
                    <span class="metric-value">${druckGerundet} hPa ${getTrendIcon(data.druck?.trend)}</span>
                  </div>
                </div>
              </div>
            </div>`;
        }

        if (data.wohnzimmer) {
          wrapper.innerHTML += `
            <div class="card orange">
              <div class="card-icon">📻</div>
              <div class="card-content">
                <div class="card-header">
                  <div class="card-title-group">
                    <h3>Wohnzimmer</h3>
                    <p>Hauptmodul</p>
                  </div>
                </div>
                <div class="metrics-box">
                  <div class="metric">
                    <span class="metric-label">Temp</span>
                    <span class="metric-value">${data.wohnzimmer.temp ?? '--'} °C ${getTrendIcon(data.wohnzimmer.trend)}</span>
                  </div>
                  <div class="metric">
                    <span class="metric-label">Feuchte</span>
                    <span class="metric-value">${data.wohnzimmer.hum ?? '--'} %</span>
                  </div>
                  <div class="metric">
                    <span class="metric-label">CO₂</span>
                    <span class="metric-value">${data.wohnzimmer.co2 ?? '--'} ppm</span>
                  </div>
                </div>
              </div>
            </div>`;
        }

        const bueroData = data.buero || data.firma;
        if (bueroData) {
          wrapper.innerHTML += `
            <div class="card purple">
              <div class="card-icon">🏢</div>
              <div class="card-content">
                <div class="card-header">
                  <div class="card-title-group">
                    <h3>Büro</h3>
                    <p>Arbeitszimmer</p>
                  </div>
                  ${getBatteryBadge(bueroData.battery)}
                </div>
                <div class="metrics-box">
                  <div class="metric">
                    <span class="metric-label">Temp</span>
                    <span class="metric-value">${bueroData.temp ?? '--'} °C ${getTrendIcon(bueroData.trend)}</span>
                  </div>
                  <div class="metric">
                    <span class="metric-label">Feuchte</span>
                    <span class="metric-value">${bueroData.hum ?? '--'} %</span>
                  </div>
                  <div class="metric">
                    <span class="metric-label">CO₂</span>
                    <span class="metric-value">${bueroData.co2 ?? '--'} ppm</span>
                  </div>
                </div>
              </div>
            </div>`;
        }

        if (data.og) {
          wrapper.innerHTML += `
            <div class="card green">
              <div class="card-icon">🏠</div>
              <div class="card-content">
                <div class="card-header">
                  <div class="card-title-group">
                    <h3>Obergeschoss</h3>
                    <p>Zusatzmodul OG</p>
                  </div>
                  ${getBatteryBadge(data.og.battery)}
                </div>
                <div class="metrics-box">
                  <div class="metric">
                    <span class="metric-label">Temp</span>
                    <span class="metric-value">${data.og.temp ?? '--'} °C ${getTrendIcon(data.og.trend)}</span>
                  </div>
                  <div class="metric">
                    <span class="metric-label">Feuchte</span>
                    <span class="metric-value">${data.og.hum ?? '--'} %</span>
                  </div>
                  <div class="metric">
                    <span class="metric-label">CO₂</span>
                    <span class="metric-value">${data.og.co2 ?? '--'} ppm</span>
                  </div>
                </div>
              </div>
            </div>`;
        }

        // ================= SEITE 2: REGENSENSOR & OPEN-METEO =================
        const forecastWrapper = document.getElementById('forecast-cards');
        forecastWrapper.innerHTML = '';

        if (data.regen) {
          const rainCurrent = data.regen.rain ?? 0;
          const sum1h = data.regen.sum_1h ?? 0;
          const sum24h = data.regen.sum_24h ?? 0;

          forecastWrapper.innerHTML += `
            <div class="card blue">
              <div class="card-icon">🌧️</div>
              <div class="card-content">
                <div class="card-header">
                  <div class="card-title-group">
                    <h3>Regensensor</h3>
                    <p>Netatmo Regenmesser</p>
                  </div>
                  ${getBatteryBadge(data.regen.battery)}
                </div>
                <div class="metrics-box">
                  <div class="metric">
                    <span class="metric-label">Aktuell</span>
                    <span class="metric-value" style="color: #38bdf8;">${rainCurrent} mm/h</span>
                  </div>
                  <div class="metric">
                    <span class="metric-label">Letzte Std</span>
                    <span class="metric-value">${sum1h} mm</span>
                  </div>
                  <div class="metric">
                    <span class="metric-label">24 Std</span>
                    <span class="metric-value">${sum24h} mm</span>
                  </div>
                </div>
              </div>
            </div>`;
        }

        if (data.vorhersage && data.vorhersage.daily) {
          const daily = data.vorhersage.daily;

          let dailyHTML = `
            <div class="card green">
              <div class="card-icon">📅</div>
              <div class="card-content">
                <div class="card-header">
                  <div class="card-title-group">
                    <h3>3-Tage Vorhersage</h3>
                    <p>Nohfelden-Eiweiler</p>
                  </div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 4px;">`;

          for (let i = 0; i < daily.time.length && i < 3; i++) {
            const dayName = getDayName(daily.time[i]);
            const wInfo = getWeatherInfo(daily.weathercode[i]);
            const max = Math.round(daily.temperature_2m_max[i]);
            const min = Math.round(daily.temperature_2m_min[i]);

            dailyHTML += `
              <div class="metrics-box" style="padding: 6px 10px;">
                <span style="font-weight: 600; width: 45px;">${dayName}</span>
                <span style="font-size: 0.9rem;">${wInfo.icon}</span>
                <span style="font-size: 0.75rem; color: #94a3b8; flex: 1; margin-left: 6px;">${wInfo.desc}</span>
                <span style="font-weight: 700; font-size: 0.8rem;">${max}° / <span style="color: #38bdf8;">${min}°</span></span>
              </div>`;
          }

          dailyHTML += `</div></div></div>`;
          forecastWrapper.innerHTML += dailyHTML;

          if (data.vorhersage.hourly) {
            const hourly = data.vorhersage.hourly;
            const now = new Date();
            now.setMinutes(0, 0, 0);

            let hourlyHTML = `
              <div class="card orange">
                <div class="card-icon">⏱️</div>
                <div class="card-content">
                  <div class="card-header">
                    <div class="card-title-group">
                      <h3>Stündlicher Trend</h3>
                      <p>Nächste 5 Stunden</p>
                    </div>
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 4px;">`;

            let count = 0;
            for (let i = 0; i < hourly.time.length; i++) {
              const itemTime = new Date(hourly.time[i]);

              if (itemTime >= now && count < 5) {
                const hourStr = itemTime.getHours().toString().padStart(2, '0') + ':00';
                const temp = hourly.temperature_2m[i].toFixed(1);
                const prob = hourly.precipitation_probability[i];
                const rain = hourly.precipitation[i];
                const wInfo = getWeatherInfo(hourly.weathercode[i]);

                hourlyHTML += `
                  <div class="metrics-box" style="padding: 5px 10px; font-size: 0.75rem;">
                    <span style="font-weight: 600; width: 45px;">${hourStr}</span>
                    <span>${wInfo.icon}</span>
                    <span style="font-weight: 700; white-space: nowrap; margin-left: auto; margin-right: 12px;">${temp} °C</span>
                    <span style="color: #94a3b8;">💧 ${prob}% ${rain > 0 ? `(${rain}mm)` : ''}</span>
                  </div>`;
                count++;
              }
            }

            hourlyHTML += `</div></div></div>`;
            forecastWrapper.innerHTML += hourlyHTML;
          }
        }

      } catch (e) {
        console.error("Fehler beim Laden:", e);
        document.getElementById('timestamp-text').innerText = "Fehler beim Laden der Daten!";
      }
    }

    const slider = document.getElementById('slider');
    const dots = document.querySelectorAll('.dot');

    function scrollToPage(index) {
      const pageWidth = slider.clientWidth;
      slider.scrollTo({
        left: pageWidth * index,
        behavior: 'smooth'
      });
    }

    slider.addEventListener('scroll', () => {
      const pageIndex = Math.round(slider.scrollLeft / slider.clientWidth);
      dots.forEach((dot, idx) => {
        dot.classList.toggle('active', idx === pageIndex);
      });
    });

    loadData();
  </script>
</body>
</html>
