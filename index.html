<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Netatmo Wetter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Verhindert das Hochrutschen/Bouncen der Seite auf dem iPhone */
    html {
      background-color: #3E4865;
      height: 100%;
      overflow: hidden;
      position: fixed;
      width: 100%;
    }

    body {
      background: linear-gradient(135deg, #3E4865 0%, #3E4B65 100%);
      color: #f8fafc;
      height: 100%;
      width: 100%;
      /* Abstand nach oben auf 40px erhöht + Safe Area für Notch/Dynamic Island */
      padding-top: max(40px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      padding-left: 20px;
      padding-right: 20px;
      display: flex;
      justify-content: flex-start; /* Verhindert das Hochziehen bei wenig Inhalt */
      align-items: center;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .container {
      max-width: 440px;
      width: 100%;
      display: flex;
      flex-direction: column;
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .title-area h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .title-area p {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .reload-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
    }

    .reload-btn.spinning {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .pages-slider {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; 
      -ms-overflow-style: none;
      width: 100%;
      border-radius: 16px;
    }

    .pages-slider::-webkit-scrollbar {
      display: none;
    }

    .page {
      flex: 0 0 100%;
      min-width: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      box-sizing: border-box;
    }

    #page1 {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .page-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dot.active {
      background: #38bdf8;
      width: 20px;
      border-radius: 4px;
    }

    .cards-wrapper {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      gap: 12px;
      position: relative;
      overflow: hidden;
      align-items: center;
    }

    .card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
    }

    .card.blue::before { background-color: #38bdf8; }
    .card.orange::before { background-color: #f97316; }
    .card.purple::before { background-color: #a855f7; }
    .card.green::before { background-color: #22c55e; }

    .card-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      flex-shrink: 0;
    }

    .card-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .card-title-group h3 {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .card-title-group p {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .battery-badge {
      font-size: 0.7rem;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 7px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .battery-badge.low {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
    }

    .metrics-box {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .metric {
      display: flex;
      flex-direction: column;
    }

    .metric-label {
      font-size: 0.6rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .metric-value {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #ffffff;
    }

    .trend {
      font-size: 0.7rem;
    }

    .footer-status {
      text-align: center;
      margin-top: 12px;
      font-size: 0.75rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #eab308;
      border-radius: 50%;
      transition: background-color 0.3s ease;
    }

    .status-dot.active {
      background-color: #22c55e;
    }

    .skeleton-box {
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.05) 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
      border-radius: 6px;
      display: inline-block;
    }

    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-area">
        <h1>Netatmo Wetter</h1>
        <p>Live-Klimadaten & Prognose</p>
      </div>
      <button class="reload-btn" id="reload-btn" onclick="loadData()">↻</button>
    </header>

    <div class="pages-slider" id="slider">
      <!-- SEITE 1: Netatmo Wetterkarten -->
      <div class="page" id="page1">
        <div class="cards-wrapper" id="cards">
          <!-- Platzhalter wird per JS initial gesetzt -->
        </div>
      </div>

      <!-- SEITE 2: Regensensor & Open-Meteo Vorhersage -->
      <div class="page" id="page2">
        <div class="cards-wrapper" id="forecast-cards">
          <!-- Platzhalter wird per JS initial gesetzt -->
        </div>
      </div>
    </div>

    <div class="page-dots">
      <div class="dot active" onclick="scrollToPage(0)"></div>
      <div class="dot" onclick="scrollToPage(1)"></div>
    </div>

    <div class="footer-status">
      <span class="status-dot" id="status-dot"></span>
      <span id="timestamp-text">Werte werden geladen...</span>
    </div>
  </div>

  <script>
    function getTrendIcon(trend) {
      if (trend === 'up') return '<span class="trend" style="color: #ef4444;">▲</span>';
      if (trend === 'down') return '<span class="trend" style="color: #38bdf8;">▼</span>';
      return '<span class="trend" style="color: #94a3b8;">▶</span>';
    }

    function getBatteryBadge(percent) {
      if (percent === undefined || percent === null) return '';
      const isLow = percent <= 20;
      return `<div class="battery-badge ${isLow ? 'low' : ''}">🔋 ${percent}%</div>`;
    }

    function getWeatherInfo(code) {
      switch (code) {
        case 0:  return { desc: "Klar / Sonnig", icon: "☀️" };
        case 1:  return { desc: "Überwiegend klar", icon: "🌤️" };
        case 2:  return { desc: "Teilweise bewölkt", icon: "⛅" };
        case 3:  return { desc: "Bedeckt", icon: "☁️" };
        case 45: case 48: return { desc: "Nebel", icon: "🌫️" };
        case 51: case 53: case 55: return { desc: "Nieselregen", icon: "🌦️" };
        case 61: case 63: case 65: return { desc: "Regen", icon: "🌧️" };
        case 71: case 73: case 75: return { desc: "Schneefall", icon: "❄️" };
        case 80: case 81: case 82: return { desc: "Regenschauer", icon: "🌧️" };
        case 95: return { desc: "Gewitter", icon: "🌩️" };
        default: return { desc: "Unbekannt (" + code + ")", icon: "🌡️" };
      }
    }

    function getDayName(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('de-DE', { weekday: 'short' });
    }

    function renderSkeletons() {
      const wrapper = document.getElementById('cards');
      const forecastWrapper = document.getElementById('forecast-cards');

      const createSkeletonCard = (title, subtitle, color) => `
        <div class="card ${color}">
          <div class="card-icon"><span class="skeleton-box" style="width: 24px; height: 24px;"></span></div>
          <div class="card-content">
            <div class="card-header">
              <div class="card-title-group">
                <h3>${title}</h3>
                <p>${subtitle}</p>
              </div>
            </div>
            <div class="metrics-box">
              <div class="metric"><span class="metric-label">Temp</span><span class="skeleton-box" style="width: 50px; height: 18px;"></span></div>
              <div class="metric"><span class="metric-label">Feuchte</span><span class="skeleton-box" style="width: 40px; height: 18px;"></span></div>
              <div class="metric"><span class="metric-label">Wert</span><span class="skeleton-box" style="width: 45px; height: 18px;"></span></div>
            </div>
          </div>
        </div>`;

      wrapper.innerHTML = 
        createSkeletonCard('Außenbereich', 'Außensensor', 'blue') +
        createSkeletonCard('Wohnzimmer', 'Hauptmodul', 'orange') +
        createSkeletonCard('Büro', 'Zusatzmodul', 'purple') +
        createSkeletonCard('Obergeschoss', 'Zusatzmodul OG', 'green');

      forecastWrapper.innerHTML = 
        createSkeletonCard('Regensensor', 'Netatmo Regenmesser', 'blue') +
        createSkeletonCard('3-Tage Vorhersage', 'Nohfelden', 'green');
    }

    async function loadData() {
      const btn = document.getElementById('reload-btn');
      const dot = document.getElementById('status-dot');
      btn.classList.add('spinning');
      dot.classList.remove('active');

      try {
        const res = await fetch('https://netatmo-data-theta.vercel.app/api/data');
        const rawJson = await res.json();
        
        const rawData = rawJson.body ? rawJson.body : rawJson;
        const mainDevice = rawData.devices ? rawData.devices[0] : null;

        if (!mainDevice) return;

        const modules = mainDevice.modules || [];
        const findMod = (name) => modules.find(m => m.module_name?.toLowerCase() === name.toLowerCase()) || {};
        const findModByType = (type) => modules.find(m => m.type === type) || {};

        const draussen = findMod('Aussenbereich');
        const firma = findMod('Firma');
        const keller = findMod('Keller');
        const og = findMod('OG');
        const regen = findModByType('NAModule2');

        let forecastData = null;
        try {
          const lat = mainDevice.place?.location?.[1] || 49.58;
          const lon = mainDevice.place?.location?.[0] || 7.01;
          const forecastRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min&hourly=temperature_2m,precipitation_probability,precipitation,weathercode&timezone=Europe%2FBerlin`);
          forecastData = await forecastRes.json();
        } catch(fErr) {
          console.error("Fehler bei Vorhersage:", fErr);
        }

        const now = new Date();
        const timeText = `Zuletzt aktualisiert: ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} Uhr`;

        const cachedPayload = {
          mainDevice, draussen, firma, keller, og, regen, forecastData, timeText
        };
        localStorage.setItem('netatmo_cache', JSON.stringify(cachedPayload));

        renderData(cachedPayload);

      } catch (e) {
        console.error("Fehler beim Verarbeiten der Daten:", e);
      } finally {
        btn.classList.remove('spinning');
        dot.classList.add('active');
      }
    }

    function renderData(data) {
      const { mainDevice, draussen, firma, og, regen, forecastData, timeText } = data;
      document.getElementById('timestamp-text').innerText = timeText;

      // ================= SEITE 1 =================
      const wrapper = document.getElementById('cards');
      wrapper.innerHTML = '';

      if (draussen.dashboard_data) {
        const druck = mainDevice.dashboard_data?.Pressure;
        const druckGerundet = druck ? Math.round(druck) : '--';
        wrapper.innerHTML += `
          <div class="card blue">
            <div class="card-icon">☀️</div>
            <div class="card-content">
              <div class="card-header">
                <div class="card-title-group"><h3>Außenbereich</h3><p>Außensensor</p></div>
                ${getBatteryBadge(draussen.battery_percent)}
              </div>
              <div class="metrics-box">
                <div class="metric"><span class="metric-label">Temp</span><span class="metric-value">${draussen.dashboard_data.Temperature ?? '--'} °C ${getTrendIcon(draussen.dashboard_data.temp_trend)}</span></div>
                <div class="metric"><span class="metric-label">Feuchte</span><span class="metric-value">${draussen.dashboard_data.Humidity ?? '--'} %</span></div>
                <div class="metric"><span class="metric-label">Druck</span><span class="metric-value">${druckGerundet} hPa ${getTrendIcon(mainDevice.dashboard_data?.pressure_trend)}</span></div>
              </div>
            </div>
          </div>`;
      }

      if (mainDevice.dashboard_data) {
        wrapper.innerHTML += `
          <div class="card orange">
            <div class="card-icon">📻</div>
            <div class="card-content">
              <div class="card-header"><div class="card-title-group"><h3>Wohnzimmer</h3><p>Hauptmodul</p></div></div>
              <div class="metrics-box">
                <div class="metric"><span class="metric-label">Temp</span><span class="metric-value">${mainDevice.dashboard_data.Temperature ?? '--'} °C ${getTrendIcon(mainDevice.dashboard_data.temp_trend)}</span></div>
                <div class="metric"><span class="metric-label">Feuchte</span><span class="metric-value">${mainDevice.dashboard_data.Humidity ?? '--'} %</span></div>
                <div class="metric"><span class="metric-label">CO₂</span><span class="metric-value">${mainDevice.dashboard_data.CO2 ?? '--'} ppm</span></div>
              </div>
            </div>
          </div>`;
      }

      if (firma.dashboard_data) {
        wrapper.innerHTML += `
          <div class="card purple">
            <div class="card-icon">🏢</div>
            <div class="card-content">
              <div class="card-header">
                <div class="card-title-group"><h3>Büro</h3><p>Zusatzmodul</p></div>
                ${getBatteryBadge(firma.battery_percent)}
              </div>
              <div class="metrics-box">
                <div class="metric"><span class="metric-label">Temp</span><span class="metric-value">${firma.dashboard_data.Temperature ?? '--'} °C ${getTrendIcon(firma.dashboard_data.temp_trend)}</span></div>
                <div class="metric"><span class="metric-label">Feuchte</span><span class="metric-value">${firma.dashboard_data.Humidity ?? '--'} %</span></div>
                <div class="metric"><span class="metric-label">CO₂</span><span class="metric-value">${firma.dashboard_data.CO2 ?? '--'} ppm</span></div>
              </div>
            </div>
          </div>`;
      }

      if (og.dashboard_data) {
        wrapper.innerHTML += `
          <div class="card green">
            <div class="card-icon">🏠</div>
            <div class="card-content">
              <div class="card-header">
                <div class="card-title-group"><h3>Obergeschoss</h3><p>Zusatzmodul OG</p></div>
                ${getBatteryBadge(og.battery_percent)}
              </div>
              <div class="metrics-box">
                <div class="metric"><span class="metric-label">Temp</span><span class="metric-value">${og.dashboard_data.Temperature ?? '--'} °C ${getTrendIcon(og.dashboard_data.temp_trend)}</span></div>
                <div class="metric"><span class="metric-label">Feuchte</span><span class="metric-value">${og.dashboard_data.Humidity ?? '--'} %</span></div>
                <div class="metric"><span class="metric-label">CO₂</span><span class="metric-value">${og.dashboard_data.CO2 ?? '--'} ppm</span></div>
              </div>
            </div>
          </div>`;
      }

      // ================= SEITE 2 =================
      const forecastWrapper = document.getElementById('forecast-cards');
      forecastWrapper.innerHTML = '';

      if (regen.dashboard_data) {
        forecastWrapper.innerHTML += `
          <div class="card blue">
            <div class="card-icon">🌧️</div>
            <div class="card-content">
              <div class="card-header">
                <div class="card-title-group"><h3>Regensensor</h3><p>Netatmo Regenmesser</p></div>
                ${getBatteryBadge(regen.battery_percent)}
              </div>
              <div class="metrics-box">
                <div class="metric"><span class="metric-label">Aktuell</span><span class="metric-value" style="color: #38bdf8;">${regen.dashboard_data.Rain ?? 0} mm/h</span></div>
                <div class="metric"><span class="metric-label">Letzte Std</span><span class="metric-value">${regen.dashboard_data.sum_rain_1 ?? 0} mm</span></div>
                <div class="metric"><span class="metric-label">24 Std</span><span class="metric-value">${regen.dashboard_data.sum_rain_24 ?? 0} mm</span></div>
              </div>
            </div>
          </div>`;
      }

      if (forecastData && forecastData.daily) {
        const daily = forecastData.daily;
        let dailyHTML = `
          <div class="card green">
            <div class="card-icon">📅</div>
            <div class="card-content">
              <div class="card-header"><div class="card-title-group"><h3>3-Tage Vorhersage</h3><p>Nohfelden</p></div></div>
              <div style="display: flex; flex-direction: column; gap: 4px;">`;

        for (let i = 0; i < daily.time.length && i < 3; i++) {
          const dayName = getDayName(daily.time[i]);
          const wInfo = getWeatherInfo(daily.weathercode[i]);
          const max = Math.round(daily.temperature_2m_max[i]);
          const min = Math.round(daily.temperature_2m_min[i]);

          dailyHTML += `
            <div class="metrics-box" style="padding: 6px 10px;">
              <span style="font-weight: 600; width: 45px;">${dayName}</span>
              <span style="font-size: 0.9rem;">${wInfo.icon}</span>
              <span style="font-size: 0.75rem; color: #94a3b8; flex: 1; margin-left: 6px;">${wInfo.desc}</span>
              <span style="font-weight: 700; font-size: 0.8rem;">${max}° / <span style="color: #38bdf8;">${min}°</span></span>
            </div>`;
        }
        dailyHTML += `</div></div></div>`;
        forecastWrapper.innerHTML += dailyHTML;

        if (forecastData.hourly && forecastData.hourly.time) {
          const hourly = forecastData.hourly;
          const currentTime = new Date();
          currentTime.setMinutes(0, 0, 0);

          let hourlyHTML = `
            <div class="card orange">
              <div class="card-icon">⏱️</div>
              <div class="card-content">
                <div class="card-header"><div class="card-title-group"><h3>Stündlicher Trend</h3><p>Nächste 5 Stunden</p></div></div>
                <div style="display: flex; flex-direction: column; gap: 4px;">`;

          let count = 0;
          for (let i = 0; i < hourly.time.length; i++) {
            const itemTime = new Date(hourly.time[i]);
            if (itemTime >= currentTime && count < 5) {
              const hourStr = itemTime.getHours().toString().padStart(2, '0') + ':00';
              const temp = hourly.temperature_2m[i] !== undefined ? hourly.temperature_2m[i].toFixed(1) : '--';
              const prob = hourly.precipitation_probability ? hourly.precipitation_probability[i] : 0;
              const rain = hourly.precipitation ? hourly.precipitation[i] : 0;
              const wInfo = getWeatherInfo(hourly.weathercode[i]);

              hourlyHTML += `
                <div class="metrics-box" style="padding: 5px 10px; font-size: 0.75rem;">
                  <span style="font-weight: 600; width: 45px;">${hourStr}</span>
                  <span>${wInfo.icon}</span>
                  <span style="font-weight: 700; white-space: nowrap; margin-left: auto; margin-right: 12px;">${temp} °C</span>
                  <span style="color: #94a3b8;">💧 ${prob}% ${rain > 0 ? `(${rain}mm)` : ''}</span>
                </div>`;
              count++;
            }
          }
          hourlyHTML += `</div></div></div>`;
          forecastWrapper.innerHTML += hourlyHTML;
        }
      }
    }

    // INITIALISIERUNG
    const slider = document.getElementById('slider');
    const dots = document.querySelectorAll('.dot');

    function scrollToPage(index) {
      const pageWidth = slider.clientWidth;
      slider.scrollTo({ left: pageWidth * index, behavior: 'smooth' });
    }

    slider.addEventListener('scroll', () => {
      const pageIndex = Math.round(slider.scrollLeft / slider.clientWidth);
      dots.forEach((dot, idx) => dot.classList.toggle('active', idx === pageIndex));
    });

    // 1. Sofort vorhandenen Speicher auslesen
    const savedData = localStorage.getItem('netatmo_cache');
    if (savedData) {
      try {
        renderData(JSON.parse(savedData));
      } catch(e) { renderSkeletons(); }
    } else {
      renderSkeletons();
    }

    // 2. Im Hintergrund frisch abrufen
    loadData();
  </script>
</body>
</html>
