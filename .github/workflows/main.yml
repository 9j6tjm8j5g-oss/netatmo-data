name: Netatmo & E-Paper Update

on:
  schedule:
    - cron: '6,16,26,36,46,56 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [cron_trigger]

permissions:
  contents: write

jobs:
  update-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Bricht den Job nach spätestens 5 Min. ab, damit nie wieder etwas endlos hängt
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Python Pakete & Playwright installieren
        run: |
          pip install requests playwright
          playwright install chromium

      - name: Netatmo Daten abrufen & Bild erzeugen
        env:
          NETATMO_CLIENT_ID: ${{ secrets.NETATMO_CLIENT_ID }}
          NETATMO_CLIENT_SECRET: ${{ secrets.NETATMO_CLIENT_SECRET }}
          NETATMO_REFRESH_TOKEN: ${{ secrets.NETATMO_REFRESH_TOKEN }}
        run: |
          python fetch_netatmo.py
          python generate_image.py

      - name: Änderungen speichern & pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Automatisches Update"
          git pull --rebase -X ours origin main || git rebase --abort
          git push origin main
