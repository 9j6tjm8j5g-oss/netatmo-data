name: Netatmo & E-Paper Update

on:
  schedule:
    - cron: '8,18,28,38,48,58 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [cron_trigger]

permissions:
  contents: write

jobs:
  update-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Python Pakete & Playwright installieren
        run: |
          pip install requests playwright
          playwright install chromium --with-deps

      - name: Netatmo Daten abrufen & Bild erzeugen
        env:
          NETATMO_CLIENT_ID: ${{ secrets.NETATMO_CLIENT_ID }}
          NETATMO_CLIENT_SECRET: ${{ secrets.NETATMO_CLIENT_SECRET }}
          NETATMO_REFRESH_TOKEN: ${{ secrets.NETATMO_REFRESH_TOKEN }}
        run: |
          python fetch_netatmo.py
          python generate_image.py

      - name: Änderungen speichern & pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automatisches Update" || exit 0
          git pull --rebase origin main
          git push
