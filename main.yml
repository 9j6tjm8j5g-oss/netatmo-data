name: Netatmo & E-Paper Update

on:
  schedule:
    - cron: '0 * * * *'  # Pünktlich einmal pro Stunde
  workflow_dispatch:     # Ermöglicht manuelles Starten

permissions:
  contents: write

jobs:
  update-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Python Pakete installieren
        run: pip install requests

      - name: Netatmo Daten abrufen
        env:
          NETATMO_CLIENT_ID: ${{ secrets.NETATMO_CLIENT_ID }}
          NETATMO_CLIENT_SECRET: ${{ secrets.NETATMO_CLIENT_SECRET }}
          NETATMO_REFRESH_TOKEN: ${{ secrets.NETATMO_REFRESH_TOKEN }}
        run: python fetch_netatmo.py

      - name: Node.js & Playwright einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright installieren
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Screenshot erstellen
        run: |
          node -e '
          const { chromium } = require("playwright");
          const path = require("path");

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 800, height: 480 } });
            const filePath = path.join(process.cwd(), "epaper.html");
            await page.goto("file://" + filePath, { waitUntil: "domcontentloaded" });
            await page.waitForTimeout(3000);
            await page.screenshot({ path: "display.png", type: "png" });
            await browser.close();
          })();
          '

      - name: Änderungen speichern
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json token.json display.png
          git commit -m "Automatisches Update" || exit 0
          git push
